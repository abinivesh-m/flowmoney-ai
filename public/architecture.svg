<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#FAF8F2; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#385741"/>
      <stop offset="100%" stop-color="#233B2B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFEB"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18191B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#FAF8F2" stroke="#E6E1D1" stroke-width="2"/>

  <!-- Title & Header -->
  <text x="60" y="70" font-size="24" font-weight="800" fill="#18191B" letter-spacing="-0.5">FLOWMONEY AI — SYSTEM ARCHITECTURE</text>
  <text x="60" y="94" font-size="12" font-weight="600" fill="#6E726D" letter-spacing="1">PROBLEM STATEMENT 04 // VOICE-FIRST LIVING MONEY MODEL // WISPR FLOW PRO</text>

  <!-- 1. Voice Ingestion Stage -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="240" height="480" rx="14" fill="url(#cardGrad)" stroke="#E6E1D1" stroke-width="1.5"/>
    <rect x="20" y="20" width="200" height="32" rx="6" fill="#E9EFE9"/>
    <text x="120" y="41" font-size="11" font-weight="700" fill="#385741" text-anchor="middle">STAGE 1: VOICE INGESTION</text>
    
    <!-- Step A: Wispr Flow Dictation -->
    <rect x="20" y="75" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="35" y="100" font-size="12" font-weight="700" fill="#18191B">Wispr Flow Pro</text>
    <text x="35" y="120" font-size="10" fill="#6E726D">Natural Speech Capture</text>
    <text x="35" y="145" font-size="9" fill="#385741" font-weight="600">• 200+ WPM Dictation</text>
    <text x="35" y="158" font-size="9" fill="#385741" font-weight="600">• Raw unedited thought stream</text>

    <!-- Step B: Messy Ingestion -->
    <rect x="20" y="185" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="35" y="210" font-size="12" font-weight="700" fill="#18191B">Messy Ingest Parser</text>
    <text x="35" y="230" font-size="10" fill="#6E726D">Pillar 1: Data Intake</text>
    <text x="35" y="255" font-size="9" fill="#18191B">• Bank SMS Alerts (HDFC/SBI)</text>
    <text x="35" y="270" font-size="9" fill="#18191B">• Messy CSV Statements</text>
    <text x="35" y="285" font-size="9" fill="#18191B">• Raw PDF Statements Extract</text>

    <!-- Step C: Telemetry -->
    <rect x="20" y="315" width="200" height="135" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="35" y="340" font-size="12" font-weight="700" fill="#18191B">Speech De-noiser</text>
    <text x="35" y="360" font-size="10" fill="#6E726D">Real-Time Filtering</text>
    <text x="35" y="385" font-size="9" fill="#BE123C" font-weight="600">✗ Strips: 'um', 'like', 'so yeah'</text>
    <text x="35" y="405" font-size="9" fill="#385741" font-weight="600">✓ Resolves: '650' → '300'</text>
    <text x="35" y="425" font-size="9" fill="#385741" font-weight="600">✓ Verbal self-corrections</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 315 370 L 355 370" stroke="#385741" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- 2. Agentic Reasoning & Intent Dissection -->
  <g transform="translate(365, 130)" filter="url(#shadow)">
    <rect width="260" height="480" rx="14" fill="url(#cardGrad)" stroke="#E6E1D1" stroke-width="1.5"/>
    <rect x="20" y="20" width="220" height="32" rx="6" fill="#E9EFE9"/>
    <text x="130" y="41" font-size="11" font-weight="700" fill="#385741" text-anchor="middle">STAGE 2: INTENT &amp; MEMORY</text>

    <!-- Intent Router -->
    <rect x="20" y="75" width="220" height="145" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="35" y="100" font-size="12" font-weight="700" fill="#18191B">Multi-Intent Router</text>
    <text x="35" y="120" font-size="10" fill="#6E726D">Simultaneous Action Dispatch</text>
    <text x="35" y="145" font-size="9" fill="#18191B">• Action A: Log Transaction</text>
    <text x="35" y="165" font-size="9" fill="#18191B">• Action B: What-If Simulation</text>
    <text x="35" y="185" font-size="9" fill="#18191B">• Action C: Update Category Rule</text>
    <text x="35" y="205" font-size="9" fill="#18191B">• Action D: Audit Subscriptions</text>

    <!-- Learned Rules Memory (Pillar 2) -->
    <rect x="20" y="240" width="220" height="210" rx="10" fill="#FBF9F1" stroke="#385741" stroke-width="1.5"/>
    <text x="35" y="265" font-size="12" font-weight="700" fill="#385741">Autonomous Memory Engine</text>
    <text x="35" y="285" font-size="10" fill="#6E726D">Pillar 2: Correction Learning</text>
    <rect x="35" y="300" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="45" y="318" font-size="9" font-weight="600" fill="#18191B">Swiggy after 11 PM</text>
    <text x="45" y="332" font-size="8" fill="#385741">→ Late Night Munchies (98% Conf)</text>
    
    <rect x="35" y="350" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="45" y="368" font-size="9" font-weight="600" fill="#18191B">Uber to BLR Airport</text>
    <text x="45" y="382" font-size="8" fill="#385741">→ Business Reimbursement</text>

    <text x="35" y="420" font-size="9" fill="#6E726D" font-style="italic">Learns from vocal or UI fixes</text>
    <text x="35" y="435" font-size="9" fill="#385741" font-weight="700">Persists to all future txns</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 640 370 L 680 370" stroke="#385741" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- 3. Living Money Model Engine -->
  <g transform="translate(690, 130)" filter="url(#shadow)">
    <rect width="450" height="480" rx="14" fill="url(#cardGrad)" stroke="#E6E1D1" stroke-width="1.5"/>
    <rect x="20" y="20" width="410" height="32" rx="6" fill="#E9EFE9"/>
    <text x="225" y="41" font-size="11" font-weight="700" fill="#385741" text-anchor="middle">STAGE 3: LIVING MONEY MODEL &amp; OUTPUTS</text>

    <!-- Financial Profile & Goals (Pillar 4) -->
    <rect x="20" y="75" width="200" height="180" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="35" y="100" font-size="12" font-weight="700" fill="#18191B">Living Profile (Pillar 4)</text>
    <text x="35" y="125" font-size="9" fill="#6E726D">Monthly Inflow: <strong fill="#18191B">₹1,85,000</strong></text>
    <text x="35" y="145" font-size="9" fill="#6E726D">Fixed Burn: <strong fill="#18191B">₹68,000</strong></text>
    <text x="35" y="165" font-size="9" fill="#6E726D">Discretionary: <strong fill="#385741">₹75,000</strong></text>
    <text x="35" y="185" font-size="9" fill="#6E726D">Runway: <strong fill="#18191B">5.1 / 6.0 Months</strong></text>
    <text x="35" y="215" font-size="9" font-weight="700" fill="#385741">• MacBook Goal: Dec 15 (78%)</text>
    <text x="35" y="235" font-size="9" font-weight="700" fill="#D97706">• Japan Sakura: Apr 2027 (30%)</text>

    <!-- What-If Simulator (Pillar 5) -->
    <rect x="230" y="75" width="200" height="180" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="245" y="100" font-size="12" font-weight="700" fill="#18191B">What-If Sandbox (Pillar 5)</text>
    <text x="245" y="125" font-size="9" fill="#6E726D">Dynamic Living Recalculation</text>
    <text x="245" y="150" font-size="9" fill="#18191B">• Rent Shift: -₹10k to +₹15k</text>
    <text x="245" y="170" font-size="9" fill="#18191B">• Dining Cut: 0% to 50%</text>
    <text x="245" y="195" font-size="9" font-weight="700" fill="#385741">✓ Accelerates MacBook by 22d</text>
    <text x="245" y="215" font-size="9" font-weight="700" fill="#385741">✓ Frees ₹4,200/mo into Japan</text>
    <text x="245" y="235" font-size="8" fill="#6E726D">Voice or slider driven</text>

    <!-- Subscription Radar (Pillar 3) -->
    <rect x="20" y="270" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="35" y="295" font-size="11" font-weight="700" fill="#18191B">Subscription Radar (Pillar 3)</text>
    <text x="35" y="315" font-size="9" fill="#BE123C" font-weight="600">⚠️ Cult.fit 38d unused (₹21k/yr)</text>
    <text x="35" y="335" font-size="9" fill="#D97706" font-weight="600">⚠️ Netflix +30% Price Hike</text>
    <text x="35" y="350" font-size="8" fill="#385741">1-click reallocation to goals</text>

    <!-- Drift Nudges (Pillar 6) -->
    <rect x="230" y="270" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#E6E1D1"/>
    <text x="245" y="295" font-size="11" font-weight="700" fill="#18191B">Drift Nudges (Pillar 6)</text>
    <text x="245" y="315" font-size="9" fill="#BE123C" font-weight="600">🚨 Dining: +18% over target pace</text>
    <text x="245" y="335" font-size="9" fill="#385741">✓ Proactive velocity alerts</text>
    <text x="245" y="350" font-size="8" fill="#6E726D">Prompts 25% lifestyle trim</text>

    <!-- Guardrails & Audit Report (Pillars 7 & 8) -->
    <rect x="20" y="375" width="410" height="85" rx="10" fill="#E9EFE9" stroke="#C2D4C5"/>
    <text x="35" y="400" font-size="11" font-weight="700" fill="#385741">Compliance Guardrails (Pillar 8) &amp; Monthly Review Audit (Pillar 7)</text>
    <text x="35" y="420" font-size="9" fill="#24422D">• SEBI/SEC Compliant: Educational scenario modeling only. No specific stock/crypto advice.</text>
    <text x="35" y="438" font-size="9" fill="#24422D">• One-click executive review report generation with Print / Export PDF support.</text>
  </g>
</svg>
